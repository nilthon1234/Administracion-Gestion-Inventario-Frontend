<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo azul del escudo -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Forma del escudo -->
  <path d="M100 20 L170 50 L170 130 Q170 180 100 220 Q30 180 30 130 L30 50 Z" 
        fill="url(#blueGradient)" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Línea blanca vertical -->
  <line x1="100" y1="20" x2="100" y2="220" stroke="#ffffff" stroke-width="6"/>
  
  <!-- Letra "I" a la izquierda de la línea con estilo serif -->
  <text x="60" y="130" text-anchor="middle" fill="#ffffff" 
        font-family="Times New Roman, serif" font-size="60" font-weight="normal">I</text>
  
  <!-- Letra "S" a la derecha de la línea con estilo serif -->
  <text x="140" y="130" text-anchor="middle" fill="#ffffff" 
        font-family="Times New Roman, serif" font-size="60" font-weight="normal">S</text>
</svg>