<div class="container-update">
    <h2>Actualizar Venta</h2>

    <!-- Información actual -->
    <div class="current-info">
        <div class="info-group">
            <span class="info-label">Ticket:</span>
            <span class="info-value">{{nroTicket}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Código:</span>
            <span class="info-value">{{codToday}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Talla Actual:</span>
            <span class="info-value">{{size || 'No aplica'}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Precio Actual:</span>
            <span class="info-value">S/. {{price.toFixed(2)}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Empresa:</span>
            <span class="info-value"> {{company}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Tipo</span>
            <span class="info-value">: {{type}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Genero</span>
            <span class="info-value">: {{genero}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Tipo Pago</span>
            <span class="info-value">: {{payType | payTypeTranslate}}</span>
        </div>
        <div class="info-group">
            <span class="info-label">Cantidad</span>
            <span class="info-value">: {{amount}}</span>
        </div>
    </div>

    <!-- Formulario de actualización en dos columnas -->
    <div class="update-form two-columns">
        <!-- Columna izquierda -->
        <div class="form-column">
            <!-- Tipo de Producto -->
            <div class="form-group">
                <label for="producto">Tipo de Producto *</label>
                <select id="producto" [(ngModel)]="detail.producto" (change)="onTypeChange()" class="form-control">
                    <option value="">Seleccione</option>
                    <option *ngFor="let tipo of tiposProducto" [value]="tipo" [disabled]="isTipoDisabled(tipo)">
                        {{ tipo }}
                    </option>
                </select>
            </div>

            <!-- Nuevo Código -->
            <div class="form-group">
                <label for="newCodToday">Nuevo Código *</label>
                <input type="text" id="newCodToday" [(ngModel)]="detail.codToday" class="form-control" required>
            </div>

            <!-- Género (sólo si es ZAPATILLA o SANDALIA) -->
            <div class="form-group" *ngIf="showGenero">
                <label for="genero">Género *</label>
                <select id="genero" [(ngModel)]="selectedGenero" (change)="onGeneroChange()" class="form-control">
                    <option value="">Seleccione</option>
                    <option *ngFor="let g of getGenerosFiltrados()" [value]="g.nombre">{{ g.nombre }}</option>
                </select>
            </div>

            <!-- Tallas (si corresponde) -->
            <div class="form-group" *ngIf="showTallas">
                <label for="tallas">Seleccione Tallas *</label>
                <select multiple id="tallas" [(ngModel)]="detail.sizes" class="form-control tallas-select"
                    style="height: 140px;">
                    <option *ngFor="let talla of tallasDisponibles" [ngValue]="talla">
                        {{ talla }}
                    </option>
                </select>
            </div>
        </div>

        <!-- Columna derecha -->
        <div class="form-column">
            <!-- Cantidad (si es otro tipo) -->
            <div class="form-group" *ngIf="!showTallas">
                <label for="amount">Cantidad *</label>
                <input type="number" id="amount" [(ngModel)]="detail.amount" class="form-control" disabled>
            </div>

            <!-- Precio -->
            <div class="form-group">
                <label for="priceUpdate">Precio (S/.) *</label>
                <input type="number" id="priceUpdate" [(ngModel)]="detail.price" min="0" step="0.01"
                    class="form-control" required>
            </div>

            <!-- Tipo de Pago -->
            <div class="form-group">
                <label for="payType">Tipo de Pago *</label>
                <select id="payType" [(ngModel)]="detail.payType" class="form-control" disabled>
                    <option *ngFor="let pay of paymentTypes" [value]="pay.value">{{pay.display}}</option>
                </select>
            </div>

            <!-- Repositorio -->
            <div class="form-group">
                <label for="repositoryType">Repositorio *</label>
                <select id="repositoryType" [(ngModel)]="detail.repositoryType" class="form-control">
                    <option *ngFor="let repo of repositoryTypes" [value]="repo.value">{{repo.display}}</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Botón fuera de las columnas para que ocupe el ancho completo -->
    <button class="btn-update" (click)="actualizarDetalle()" [disabled]="!isFormValid()">
        Actualizar Venta
    </button>
</div>
