<app-navbars-stock></app-navbars-stock>

<div class="stock-container" *ngIf="!loading(); else spinner">
  <h1 style="text-align: center;">Productos De Almacen En 0 Stock</h1>
  <div class="header-actions">
    
    <button mat-raised-button color="primary" (click)="generatePdf()">
      <mat-icon>picture_as_pdf</mat-icon>
      Descargar PDF
    </button>
  </div>

  <div class="table-wrapper mat-elevation-z8">
    <table mat-table [dataSource]="slipper()" class="stock-table">
      <!-- Imagen -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef class="col-image">Imagen</th>
        <td mat-cell *matCellDef="let item" class="col-image">
          <img [src]="item.urlImg" [class.enlarged]="enlargedItem === item" 
               (click)="toggleImageSize(item)" class="product-image" />
        </td>
      </ng-container>

      <!-- Marca -->
      <ng-container matColumnDef="brand">
        <th mat-header-cell *matHeaderCellDef>Marca</th>
        <td mat-cell *matCellDef="let item">{{ item.brand }}</td>
      </ng-container>

      <!-- Código -->
      <ng-container matColumnDef="codToday">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let item">{{ item.codToday }}</td>
      </ng-container>

      <!-- Tipo -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let item">{{ item.type }}</td>
      </ng-container>

      <!-- Género -->
      <ng-container matColumnDef="genero">
        <th mat-header-cell *matHeaderCellDef>Género</th>
        <td mat-cell *matCellDef="let item">{{ item.genero }}</td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="registrationDate">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let item">{{ item.registrationDate | customDateFormat }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="pageNumber()"
    [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)">
  </mat-paginator>
</div>

<ng-template #spinner>
  <div class="spinner-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
</ng-template>
