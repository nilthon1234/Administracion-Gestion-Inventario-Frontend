<div class="floating-box">
  <h2>Actualizar tallas para {{codToday}}</h2>
  
  <div class="form-group">
    <label for="gender-select">Género:</label>
    <select id="gender-select" [(ngModel)]="selectedGender" (change)="onGenderSelect()" [disabled]="gender">
      <option *ngFor="let gender of genders" [value]="gender.nombre">{{ gender.nombre }}</option>
    </select>
  </div>

  <div *ngIf="selectedGender" class="sizes-container">
    <h3>Tallas disponibles:</h3>
    <div *ngIf="!sizes.length" class="no-sizes">
      Cargando tallas...
    </div>
    <div class="size-grid" *ngIf="sizes.length">
      <div *ngFor="let size of sizes" class="size-option">
        <input type="checkbox" 
               id="size-{{size.id}}" 
               [(ngModel)]="size.selected" 
               (change)="onSizeSelect()"
               [disabled]="size.disabled">
        <label for="size-{{size.id}}">{{ size.talla }}</label>
      </div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn btn-cancel" (click)="onCancel()">Cancelar</button>
    <button class="btn btn-primary" 
            (click)="onUpdate()" 
            [disabled]="!hasSelection">
      Actualizar
    </button>
  </div>
</div>
